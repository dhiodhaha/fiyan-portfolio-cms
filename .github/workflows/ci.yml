name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # No production credentials in PR jobs: exercise the documented static fallback.
      DATABASE_URL: ""
      PAYLOAD_SECRET: "ci-local-only-secret-not-for-deployment"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run lint
      - name: Verify committed Payload types
        run: |
          pnpm run payload:types
          git diff --exit-code -- payload-types.ts || { echo 'Payload types changed. Run pnpm run payload:types and commit payload-types.ts.'; exit 1; }
      - run: pnpm run test:smoke
      - run: pnpm run build
        env:
          CMS_STATIC_BUILD: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
